<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 512 512">
  <defs>
    <clipPath id="squircle">
      <rect x="0" y="0" width="512" height="512" rx="114" ry="114"/>
    </clipPath>
  </defs>

  <g clip-path="url(#squircle)">
    <rect width="512" height="512" fill="#101714"/>

    <!-- No closed ring behind the trail: at icon scale a second stroke reads as
         a competing shape. The arc sweeps nearly a full lap, which is enough to
         say "orbit" on its own. -->
    <g data-part="mini-nekko" transform="scale(20)" fill="none">
    <path d="M 5.5 10 C 5.8 6.1 7.1 3.4 7.4 2.2 Q 7.7 0.7 8.9 1.7 L 12.9 5.1 L 17.1 1.7 Q 18.3 0.7 18.6 2.2 C 18.9 3.4 20.2 6.1 20.5 10 L 20.5 17.4 C 20.5 21.2 17.2 23.2 13 23.2 C 8.8 23.2 5.5 21.2 5.5 17.4 Z" fill="#101714" stroke="#f2f1e9" stroke-width="1.7" stroke-linejoin="round"/>
    <path data-part="inner-ears" d="M 7.9 6 L 8 3.1 L 10.5 5.2 M 15.5 5.2 L 18 3.1 L 18.1 6" stroke="#f0a35e" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <g data-mascot-accessory="sunglasses" fill="#f2f1e9" stroke="#f2f1e9" stroke-width="0.9" stroke-linejoin="round" stroke-linecap="round">
      <path d="M 8.3 12.4 L 12.1 12.7 L 11.7 15 Q 9.9 15.6 8.7 14.5 Z M 14 12.7 L 17.8 12.4 L 17.4 14.5 Q 16.2 15.6 14.4 15 Z"/>
      <path d="M 12 13.2 Q 13 12.6 14.1 13.2 M 8.3 12.6 L 7 12 M 17.8 12.6 L 19.1 12" fill="none"/>
    </g>
    <path data-mascot-accessory="earpiece" d="M 20.5 12.9 Q 22.6 12.9 22.6 14.5 Q 22.6 16.1 20.5 16.1" fill="#101714" stroke="#f2f1e9" stroke-width="1.2" stroke-linecap="round"/>
    <path data-part="mouth" d="M 11.8 17.3 q 1.2 1.1 2.4 0" stroke="#f2f1e9" stroke-width="1" stroke-linecap="round" fill="none"/>
    </g>

    <!-- The body: a hot white core inside a cyan bloom. -->
  </g>

  <!-- Rim light. A dark tile on a dark taskbar loses its own edge; a hairline of
       the accent gives it back without lightening the art. -->
  <rect x="3" y="3" width="506" height="506" rx="111" ry="111"
        fill="none" stroke="#a7c8ac" stroke-opacity="0.72" stroke-width="6"/>
</svg>